name: Feature Request
description: Suggest an idea or enhancement for AI Copilot
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping make AI Copilot better!

  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear description of what the problem is.
      placeholder: I am always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Describe the Solution You'd Like
      description: A clear description of what you want to happen.
      placeholder: Describe the desired behavior or API integration...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Describe Alternatives You've Considered
      description: Any alternative solutions or workarounds you've thought about.

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, screenshots, OpenAPI snippets, or links here.
