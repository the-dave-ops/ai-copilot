name: Bug Report
description: Create a report to help us improve AI Copilot
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue!
        If this is a security vulnerability, please refer to our [Security Policy](../../SECURITY.md) instead of opening a public issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what went wrong...
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: What steps did you take before encountering the issue?
      placeholder: |
        1. Point API_BASE_URL to '...'
        2. Run 'docker compose up'
        3. Connect using auth method '...'
        4. Ask '...'
        5. See error '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Details about your environment.
      placeholder: |
        - AI Copilot Version / Commit:
        - Deployment: Docker Compose / Helm / K8s / Local Node
        - Target API Spec: OpenAPI 3.0 / 3.1 / Swagger 2.0
        - LLM Provider: OpenAI / OpenRouter / Ollama / Azure
        - Browser / OS:
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant Logs
      description: Please paste any server logs or browser console errors here (redacting any sensitive information).
      render: shell
