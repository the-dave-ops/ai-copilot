apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "api-copilot.fullname" . }}
  labels: {{- include "api-copilot.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {{- include "api-copilot.labels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "api-copilot.labels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      volumes:
        - name: generated-tools
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "api-copilot.fullname" . }}-generated
          {{- else }}
          emptyDir: {}
          {{- end }}
        {{- if .Values.customSystemPrompt.enabled }}
        - name: system-prompt
          configMap:
            name: {{ include "api-copilot.fullname" . }}-system-prompt
        {{- end }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          envFrom:
            - configMapRef:
                name: {{ include "api-copilot.fullname" . }}
            - secretRef:
                name: {{ include "api-copilot.fullname" . }}
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          volumeMounts:
            - name: generated-tools
              mountPath: {{ .Values.config.toolsDataDir | default "/app/generated" }}
            {{- if .Values.customSystemPrompt.enabled }}
            - name: system-prompt
              mountPath: /etc/api-copilot
              readOnly: true
            {{- end }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
