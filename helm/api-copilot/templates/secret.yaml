apiVersion: v1
kind: Secret
metadata:
  name: {{ include "api-copilot.fullname" . }}
  labels: {{- include "api-copilot.labels" . | nindent 4 }}
type: Opaque
stringData:
  SESSION_SECRET: {{ required "secrets.sessionSecret is required" .Values.secrets.sessionSecret | quote }}
  LLM_API_KEY: {{ .Values.secrets.llmApiKey | quote }}
  {{- if .Values.secrets.keycloakClientSecret }}
  KEYCLOAK_CLIENT_SECRET: {{ .Values.secrets.keycloakClientSecret | quote }}
  {{- end }}
