apiVersion: v1
kind: Service
metadata:
  name: {{ include "api-copilot.fullname" . }}
  labels: {{- include "api-copilot.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector: {{- include "api-copilot.labels" . | nindent 4 }}
