apiVersion: v1
kind: ConfigMap
metadata:
  name: api-copilot
  namespace: api-copilot
data:
  NODE_ENV: "production"
  PORT: "3000"
  APP_BASE_URL: "https://chat.example.com"
  SESSION_TTL_SECONDS: "28800"
  SESSION_COOKIE_SECURE: "auto"
  REDIS_URL: "redis://api-copilot-redis:6379"
  # Target API & OpenAPI spec discovery
  API_BASE_URL: "https://api.example.com"
  OPENAPI_SPEC_URL: "https://api.example.com/openapi.json"
  TOOLS_DATA_DIR: "/app/generated"
  STARTUP_AGENT_ENABLED: "true"
  FORCE_REGENERATE_TOOLS: "false"
  STARTUP_AGENT_MIN_ENDPOINTS: "15"
  STARTUP_AGENT_MAX_ENDPOINTS: "25"
  API_KEY_HEADER: "X-API-Key"
  # Optional OIDC SSO (leave empty if using Bearer / API Key / Basic / OAuth2 in UI)
  KEYCLOAK_ISSUER_URL: ""
  KEYCLOAK_CLIENT_ID: ""
  KEYCLOAK_SCOPE: "openid profile email"
  # LLM Provider (any OpenAI-compatible endpoint)
  LLM_BASE_URL: "https://api.openai.com/v1"
  LLM_MODEL: "gpt-4o"
  MAX_TOOL_STEPS: "8"
  MAX_TOOL_RESULT_CHARS: "8000"
  CHAT_RATE_LIMIT_PER_MINUTE: "20"
  CHAT_REQUEST_TIMEOUT_MS: "120000"
  API_TIMEOUT_MS: "15000"
  ENABLE_TOKEN_EXCHANGE: "false"
  TOKEN_EXCHANGE_AUDIENCE: ""
