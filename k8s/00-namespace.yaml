apiVersion: v1
kind: Namespace
metadata:
  name: api-copilot
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-copilot-redis-data
  namespace: api-copilot
  labels: { app: api-copilot-redis }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: api-copilot-generated
  namespace: api-copilot
  labels: { app: api-copilot }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 100Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-copilot-redis
  namespace: api-copilot
  labels: { app: api-copilot-redis }
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels: { app: api-copilot-redis }
  template:
    metadata:
      labels: { app: api-copilot-redis }
    spec:
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: api-copilot-redis-data
      containers:
        - name: redis
          image: redis:7-alpine
          args: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: redis-data
              mountPath: /data
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: api-copilot-redis
  namespace: api-copilot
  labels: { app: api-copilot-redis }
spec:
  type: ClusterIP
  selector: { app: api-copilot-redis }
  ports:
    - name: redis
      port: 6379
      targetPort: redis
