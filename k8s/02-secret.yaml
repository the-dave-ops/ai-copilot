apiVersion: v1
kind: Secret
metadata:
  name: api-copilot
  namespace: api-copilot
type: Opaque
stringData:
  # Generate with: openssl rand -hex 32
  SESSION_SECRET: "REPLACE_WITH_AT_LEAST_32_CHARS_RANDOM_SECRET"
  LLM_API_KEY: "REPLACE_WITH_LLM_API_KEY"
  # Optional: only needed when KEYCLOAK_ISSUER_URL is enabled
  KEYCLOAK_CLIENT_SECRET: ""
