      required:
        - resources
        - total
    AcceptPendingResourceDto:
      type: object
      properties:
        type:
          type: string
          enum: &ref_75
            - PLATFORM
            - DEVICE_TYPE
            - GROUP
            - VERSION
          description: >-
            Which kind of pending entry this is (platform / device type / group
            / version)
        token:
          type: string
          description: >-
            Identifier of the pending entry. For PLATFORM/DEVICE_TYPE/GROUP it
            is the reported token; for VERSION it is "projectName@version".
        reason:
          type: string
          description: >-
            Optional free-text note explaining the decision; stored on the
            pending entry for audit
        name:
          type: string
          description: >-
            Display name for the created resource. For PLATFORM/DEVICE_TYPE,
            defaults to the reported token. For GROUP it is a display name
            distinct from the numeric unit (the unit becomes the group id);
            defaults to "Unit <unit>".
        description:
          type: string
          description: >-
            Optional description for the created resource (e.g. a unit/group
            description).
        parentGroupId:
          type: number
          description: >-
            GROUP only: id of the parent unit to nest the new unit under. Omit
            to create a root unit.
        assignReportingDevices:
          type: boolean
          default: true
          description: >-
            GROUP only: attach the devices that reported this unit to the newly
            created unit. Defaults to true; set to false to skip.
        isDraft:
          type: boolean
          description: >-
            VERSION only: create the version as a draft release. Defaults to
            true.
        username:
          type: string
          description: >-
            Username performing the action. Populated from the auth token by the
            gateway (used when a VERSION accept creates the project/release on
            the user behalf).
      required:
        - type
        - token
    RejectPendingResourceDto:
      type: object
      properties:
        type:
          type: string
          enum: *ref_75
          description: >-
            Which kind of pending entry this is (platform / device type / group
            / version)
        token:
          type: string
          description: >-
            Identifier of the pending entry. For PLATFORM/DEVICE_TYPE/GROUP it
            is the reported token; for VERSION it is "projectName@version".
        reason:
          type: string
          description: >-
            Optional free-text note explaining the decision; stored on the
            pending entry for audit
      required:
        - type
        - token
    EvaluateRuleDto:
      type: object
      properties:
        ruleId:
          type: string
          description: ID of an existing rule to evaluate. Supply either this or `rule`.
        rule:
          type: object
          description: >-
            Inline rule JSON (rule-engine format). Supply either this or
            `ruleId`.
        deviceIds:
          description: >-
            Optional list of device IDs to evaluate. If provided, only these
            devices are checked; otherwise all devices are evaluated.
          type: array
          items:
            type: string
    EvaluatedDeviceDto:
      type: object
      properties:
        deviceId:
          type: string
          description: Unique device identifier
        deviceName:
          type: string
          description: Human-readable device name
        os:
          type: string
          description: Operating system of the device
        ip:
          type: string
          description: IP address of the device
        mac:
          type: string
          description: MAC address of the device
        serialNumber:
          type: string
          description: Serial number of the device
        platformName:
          type: string
          description: Platform name the device belongs to
        deviceTypeNames:
          description: Device type names assigned to the device
          type: array
          items:
            type: string
        groupNames:
          description: Names of the groups the device belongs to
          type: array
          items:
            type: string
        discoveryMessageId:
          type: string
          description: >-
            ID of the discovery message used to build the evaluation context for
            this device
      required:
        - deviceId
    AttachedReleaseDto:
      type: object
      properties:
        catalogId:
          type: string
          description: Catalog ID of the release
        version:
          type: string
          description: Version string of the release
        projectId:
          type: string
          description: Project ID the release belongs to
        projectName:
          type: string
          description: Project name the release belongs to
    EvaluateRuleResultDto:
      type: object
      properties:
        matchingDevices:
          description: Devices whose latest discovery data matched the rule
          type: array
          items:
            $ref: '#/components/schemas/EvaluatedDeviceDto'
        totalDevicesEvaluated:
          type: number
          description: Total number of devices evaluated
        matchingCount:
          type: number
          description: Number of devices that matched the rule
        attachedReleases:
          description: >-
            Releases the policy is attached to (only present for saved policy
            rules)
          type: array
          items:
            $ref: '#/components/schemas/AttachedReleaseDto'
      required:
        - matchingDevices
        - totalDevicesEvaluated
        - matchingCount
    DeviceContextDto:
      type: object
      properties:
        discoveryMessageId:
          type: string
          description: ID of the discovery message used to build this context
        context:
          type: object
          description: The device evaluation context as used during rule evaluation
      required:
        - discoveryMessageId
        - context
    CreateScanPayload:
      type: object
      properties:
        target:
          type: string
          description: Scan target (image name, file path, registry URL, etc.)
          example: nginx:latest
        targetType:
          type: string
          description: Type of the scan target
          enum:
            - docker
            - registry
            - file
            - dir
            - oci-archive
          example: docker
        format:
          type: string
          description: SBOM output format
          enum:
            - syft-json
            - spdx-json
            - cyclonedx-json
            - table
            - text
          default: cyclonedx-json
        triggeredBy:
          type: string
          description: Who or what triggered this scan (user ID, service name, etc.)
        isStoredInBucket:
          type: boolean
          description: >-
            Set to true when `target` is a raw object key inside the MinIO
            bucket (e.g. upload/release/1/file.msi). sbom-generator will
            generate a fresh presigned URL at execution time. Required for file
            retries to work correctly.
      required:
        - target
        - targetType
    ScanStatusResponseDto:
      type: object
      properties:
        id:
          type: string
          description: Scan job UUID
        status:
          type: string
          enum:
            - queued
            - running
            - complete
            - failed
          description: Current status of the scan
        target:
          type: string
          description: Scan target (image name, file path, registry URL, etc.)
        targetType:
          type: string
          enum:
            - docker
            - registry
            - file
            - dir
            - oci-archive
          description: Type of the scan target
        format:
          type: string
          enum:
            - syft-json
            - spdx-json
            - cyclonedx-json
            - table
            - text
          description: SBOM output format
        triggeredBy:
          type: string
          description: Who or what triggered this scan
        error:
          type: string
          description: Error message if the scan failed
        failureReason:
          type: string
          description: Short reason code for the failure
        createdAt:
          format: date-time
          type: string
          description: Timestamp when the scan was created
        updatedAt:
          format: date-time
          type: string
          description: Timestamp of the last status update
        completedAt:
          format: date-time
          type: string
          description: Timestamp when the scan reached a terminal state
      required:
        - id
        - status
        - target
        - targetType
        - format
        - createdAt
        - updatedAt
    ThroughputDataPointDto:
      type: object
      properties:
        timestamp:
          type: string
          description: Timestamp of the data point
          example: '2024-01-15T10:00:00.000Z'
        mbPerMin:
          type: number
          description: Download bandwidth in MB per minute
          example: 12.5
      required:
        - timestamp
        - mbPerMin
    DeploySuccessRateDto:
      type: object
      properties:
        rate:
          type: number
          description: Success rate as a decimal (0-1)
          example: 0.85
        total:
          type: number
          description: Total number of deployments
          example: 100
        successful:
          type: number
          description: Number of successful deployments
          example: 85
        sparkline:
          description: Sparkline data points representing daily success rates
          example:
            - 0.8
            - 0.9
            - 0.85
            - 0.92
            - 0.88
            - 0.85
            - 0.87
          type: array
          items:
            type: number
      required:
        - rate
        - total
        - successful
        - sparkline
    InstallationsCountDto:
      type: object
      properties:
        count:
          type: number
          description: Number of successful installations in the time window
          example: 42
        since:
          type: string
          description: Time window used for the query
          example: 24h
      required:
        - count
        - since
    AlertEventDto:
      type: object
      properties:
        id:
          type: string
          description: Unique alert identifier
        type:
          type: string
          enum:
            - discovery_new
            - discovery_known
            - delivery_started
            - delivery_completed
            - delivery_error
            - deploy_started
            - deploy_completed
            - deploy_error
            - pending_version
            - pending_resource
            - device_offline
            - git_sync_success
            - git_sync_failed
            - sbom_started
            - sbom_ready
            - sbom_failed
            - upload_started
            - upload_completed
            - upload_failed
            - upload_file_created
            - upload_file_deleted
            - system
          description: Type of the alert event
        severity:
          type: string
          enum:
            - critical
            - warning
            - info
          description: Severity level of the alert
        message:
          type: string
          description: Human-readable alert message
        deviceId:
          type: string
          description: Device ID associated with the alert
        projectId:
          type: number
          description: Project ID associated with the alert
        catalogId:
          type: string
          description: Catalog ID associated with the alert
        source:
          type: string
          description: Source service that generated the alert
        metadata:
          type: object
          description: Additional metadata
        createdAt:
          type: string
          description: Timestamp when the alert was created
          example: '2024-01-15T10:30:00.000Z'
      required:
        - id
        - type
        - severity
        - message
        - createdAt
    AlertStreamMessageDto:
      type: object
      properties:
        data:
          description: The alert event payload
          allOf:
            - $ref: '#/components/schemas/AlertEventDto'
        id:
          type: string
          description: Unique event ID (same as the alert id)
          example: abc123
        type:
          type: string
          description: SSE event type
          example: alert
      required:
        - data
        - id
        - type
    DeviceStatusEventDto:
      type: object
      properties:
        type:
          type: string
          default: device_status_update
        deviceId:
          type: string
          description: The device identifier
        projectId:
          type: string
          description: >-
            Project ID the release belongs to. Present for DELIVERY and DEPLOY
            events.
        releaseId:
          type: string
          description: >-
            Release/catalog ID being delivered or deployed. Present for DELIVERY
            and DEPLOY events.
        statusType:
          type: string
          enum:
            - discovery
            - delivery
            - deploy
          description: 'Which pipeline stage: discovery, delivery, or deploy'
        status:
          type: string
          enum:
            - new
            - discovered
            - Start
            - Done
            - Error
            - Download
            - Installing
            - Continue
            - Pause
            - Cancelled
            - Uninstall
            - Deleted
          description: Current status value (e.g. Start, Done, Error, Download, Installing)
        timestamp:
          type: string
          description: ISO 8601 timestamp of when the event occurred
          example: '2026-06-10T10:00:00.000Z'
        message:
          type: string
          description: Human-readable description of the event
        error:
          type: string
          description: Error message when status is Error
        progress:
          type: number
          description: Progress percentage (0-100) for DELIVERY/DEPLOY events
          minimum: 0
          maximum: 100
        metadata:
          description: Device details. Typically present only for DISCOVERY events.
          allOf:
            - $ref: '#/components/schemas/DeviceDto'
      required:
        - type
        - deviceId
        - statusType
        - status
        - timestamp
    DeviceStatusStreamMessageDto:
      type: object
      properties:
        data:
          description: The device status event payload
          allOf:
            - $ref: '#/components/schemas/DeviceStatusEventDto'
        id:
          type: string
          description: Unique event ID (timestamp-based)
          example: '1718010000000'
        type:
          type: string
          description: SSE event type
          example: device_status_update
      required:
        - data
        - id
        - type