  /api/v2/device/{deviceId}/events/managed:
    get:
      operationId: v2_deviceManagedCommandStream
      summary: Device managed-command SSE channel
      description: >-
        Long-lived Server-Sent Events stream the device opens after a confirmed
        handshake. Emits `: ping` keepalives and command events (Discovery,
        Push, DeliveryStart, …). Registering the stream marks the device online;
        closing it marks it offline immediately.
      parameters:
        - name: deviceId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: >-
            SSE stream (`text/event-stream`). Each frame is an `event:` name
            (one of: Discovery, Push, DeliveryStart, DeliveryStop,
            DeliveryCancel, DeliveryDelete, DeployStart, MetadataRequest) plus a
            `data:` `ReactiveCommandEventDto` body. `: ping` keepalive comments
            carry no event.
          content:
            text/event-stream:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ReactiveCommandEventDtoFrame'
                  - title: Keepalive comment
                    type: string
                    description: >-
                      Raw SSE comment line `: ping` (no `event:`/`data:`), sent
                      to keep the stream open.
                    example: ': ping'
      tags:
        - Device
      security:
        - bearer: []
  /api/v1/device/reactive/command:
    post:
      operationId: ReactiveController_sendCommand
      summary: Dispatch a reactive command to one, many, or all connected devices
      description: >-
        Pushes a command event (Discovery, Push, DeliveryStart, …) down each
        target device's managed-command SSE channel. `deviceId` accepts a single
        id or an array; pass the literal "all" to target every
        currently-connected device. Always returns a succeeded/failed summary —
        offline devices are reported, never an error.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReactiveCommandDto'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReactiveDispatchResultDto'
      tags: &ref_28
        - Device - reactive
      security: &ref_29
        - bearer: []
