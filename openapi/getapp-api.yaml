  /api/v1/device/events/presence:
    get:
      operationId: devicePresenceStream
      summary: Dashboard device-presence SSE stream
      description: >-
        Long-lived Server-Sent Events stream for the dashboard. Opens with a
        `snapshot` event carrying the currently-online device ids, then emits a
        `device-presence` event per online/offline transition. `: ping`
        keepalive comments keep the stream warm.
      parameters: []
      responses:
        '200':
          description: >-
            SSE stream (`text/event-stream`). First frame is `event: snapshot`
            with `data:` a `DevicePresenceDto[]` of the currently-online
            devices; each following `event: device-presence` frame carries a
            single `DevicePresenceDto`. `: ping` keepalive comments carry no
            event.
          content:
            text/event-stream:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/DevicePresenceDtoFrame'
                  - $ref: '#/components/schemas/DevicePresenceDtoFrameArray'
                  - title: Keepalive comment
                    type: string
                    description: >-
                      Raw SSE comment line `: ping` (no `event:`/`data:`), sent
                      to keep the stream open.
                    example: ': ping'
      tags:
        - Device - reactive
      security:
        - bearer: []
