  /api/v2/telemetry/logs:
    get:
      operationId: v2_TelemetryController_getLogs
      summary: Query Agent Logs
      description: >-
        Retrieves collected agent logs from Elasticsearch, filtered by device,
        groups, topics, levels, free text and time range. Intended to back log
        dashboards in the UI.
      parameters:
        - name: deviceId
          required: false
          in: query
          description: Filter by a single device ID
          schema:
            type: string
        - name: groups
          required: false
          in: query
          description: Filter by one or more groups. A group encapsulates multiple topics.
          schema:
            type: array
            items:
              type: string
        - name: topics
          required: false
          in: query
          description: >-
            Filter by one or more topics (within the selected groups when
            provided).
          schema:
            type: array
            items:
              type: string
        - name: levels
          required: false
          in: query
          description: Filter by one or more log levels
          schema:
            type: array
            items:
              type: string
              enum:
                - DEBUG
                - INFO
                - WARN
                - ERROR
                - FATAL
        - name: from
          required: false
          in: query
          description: Start of the time range (ISO 8601). Defaults to 1 hour ago.
          schema:
            type: string
        - name: to
          required: false
          in: query
          description: End of the time range (ISO 8601). Defaults to now.
          schema:
            type: string
        - name: search
          required: false
          in: query
          description: Free-text search over the log message
          schema:
            type: string
        - name: limit
          required: false
          in: query
          description: Max number of logs to return (default 100, max 1000)
          schema:
            type: number
        - name: offset
          required: false
          in: query
          description: Number of logs to skip for pagination (default 0)
          schema:
            type: number
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogsQueryResultDto'
      tags: &ref_32
        - Telemetry
