      tags: *ref_48
      security: *ref_49
  /api/v1/resources/pending:
    get:
      operationId: PendingResourceController_listPendingResources
      summary: List pending entries
      description: >-
        Returns pending Platform / Device Type / Group references and pending
        Versions reported by devices that do not yet exist in the system. Filter
        by `type` to narrow to one kind.
      parameters:
        - name: limit
          required: false
          in: query
          description: 'Number of results to return (default: 100)'
          schema:
            type: number
        - name: offset
          required: false
          in: query
          description: 'Offset for pagination (default: 0)'
          schema:
            type: number
        - name: status
          required: false
          in: query
          schema:
            enum:
              - PENDING
              - ACCEPTED
              - REJECTED
            type: string
        - name: type
          required: false
          in: query
          schema:
            enum:
              - PLATFORM
              - DEVICE_TYPE
              - GROUP
              - VERSION
            type: string
      responses:
        '200':
          description: List of pending resources retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingResourceListDto'
      tags: &ref_50
        - Resources - Pending
      security: &ref_51
        - bearer: []
  /api/v1/resources/pending/accept:
    post:
      operationId: PendingResourceController_acceptPendingResource
      summary: Accept a pending entry
      description: >-
        Recognizes a pending Platform / Device Type / Group / Version. Resources
        are auto-created from the reported values (existing ones are just
        cleared); a Version is created via the pending-versions flow.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcceptPendingResourceDto'
      responses:
        '200':
          description: Entry accepted and recognized
        '400':
          description: Invalid request or entry already processed
      tags: *ref_50
      security: *ref_51
  /api/v1/resources/pending/reject:
    post:
      operationId: PendingResourceController_rejectPendingResource
      summary: Reject a pending entry
      description: >-
        Rejects a pending Platform / Device Type / Group / Version. The entry is
        marked as rejected and will not be created.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RejectPendingResourceDto'
      responses:
        '200':
          description: Entry rejected
        '400':
          description: Invalid request or entry already processed
      tags: *ref_50
      security: *ref_51
  /api/v1/rules:
    get:
      operationId: RulesController_getAllRules
      summary: Get all rules
      description: >-
        Fetches all rules (both policies and restrictions) from upload and
        discovery services. Supports filtering by type to query only policies or
        restrictions.
      parameters:
        - name: type
          required: false
          in: query
          description: Filter by rule type (policy or restriction)
          schema:
            enum:
              - policy
              - restriction
            type: string
        - name: isActive
          required: false
          in: query
          description: Filter by active status
          schema:
            type: boolean
        - name: releaseId
          required: false
          in: query
          description: Filter by release ID (policies only)
          schema:
            type: string
        - name: deviceTypeName
          required: false
          in: query
          description: Filter by device type name (restrictions only)
          schema:
            type: string
        - name: deviceTypeId
          required: false
          in: query
          description: Filter by device type ID (restrictions only)
          schema:
            type: number
        - name: deviceId
          required: false
          in: query
          description: Filter by device ID (restrictions only)
          schema:
            type: string
        - name: osType
          required: false
          in: query
          description: Filter by OS type (restrictions only)
          schema:
            type: string
      responses:
        '200':
          description: List of all rules
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
      tags: &ref_52
        - Rules
      security: &ref_53
        - bearer: []
  /api/v1/rules/evaluate:
    post:
      operationId: RulesController_evaluateRule
      summary: Evaluate a rule against all devices
      description: >-
        Tests a rule against every device using its latest discovery data.
        Supply either a saved ruleId or an inline rule JSON. For saved policy
        rules the response additionally contains the releases the policy is
        attached to.
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateRuleDto'
      responses:
        '200':
          description: Devices matching the rule, plus release context for policies
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvaluateRuleResultDto'
      tags: *ref_52
      security: *ref_53
  /api/v1/rules/device-context:
    get:
      operationId: RulesController_getDeviceContext
      summary: Get device evaluation context
      description: >-
        Returns the evaluation context built from the latest discovery message
        for a device. Supply either deviceId (returns the latest message for
        that device) or discoveryMessageId (returns the context for that exact
        message, deviceId not required). The context structure is identical to
        what is used internally during rule evaluation.
      parameters:
        - name: deviceId
          required: false
          in: query
          description: >-
            Device ID to look up. Required when discoveryMessageId is not
            provided.
          schema:
            type: string
        - name: discoveryMessageId
          required: false
          in: query
          description: >-
            ID of a specific discovery message to use. When provided, deviceId
            is not required.
          schema:
            type: string
      responses:
        '200':
          description: Device context and the discovery message it was built from
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceContextDto'
      tags: *ref_52
      security: *ref_53
  /api/v1/sbom/scans:
    post:
      operationId: SbomController_requestScan
      summary: Queue a new SBOM scan for a docker image, binary file, or directory
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScanPayload'
      responses:
        '201':
          description: Scan queued successfully, returns scanId
      tags: &ref_54
        - SBOM
      security: &ref_55
        - bearer: []
    get:
      operationId: SbomController_listScans
      summary: List recent SBOM scan jobs
      parameters:
        - name: limit
          required: false
          in: query
          schema:
            type: number
        - name: offset
          required: false
          in: query
          schema:
            type: number
      responses:
        '200':
          description: Array of scan status objects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScanStatusResponseDto'
      tags: *ref_54
      security: *ref_55
  /api/v1/sbom/scans/{id}:
    get:
      operationId: SbomController_getScanStatus
      summary: Get scan status and metadata by ID
      parameters:
        - name: id
          required: true
          in: path
          description: Scan job UUID
          schema:
            type: string
      responses:
        '200':
          description: Scan status and metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanStatusResponseDto'
        '404':
          description: Scan not found
      tags: *ref_54
      security: *ref_55
    delete:
      operationId: SbomController_deleteScan
      summary: Delete a scan by ID. Cancels it if still queued.
      parameters:
        - name: id
          required: true
          in: path
          description: Scan job UUID
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags: *ref_54
      security: *ref_55
  /api/v1/sbom/scans/{id}/report:
    get:
      operationId: SbomController_getScanReportUrl
      summary: Get presigned download URL for a completed SBOM report
      parameters:
        - name: id
          required: true
          in: path
          description: Scan job UUID
          schema:
            type: string
      responses:
        '200':
          description: ''
      tags: *ref_54
      security: *ref_55
  /api/v1/sbom/scans/{id}/retry:
    post:
      operationId: SbomController_retryScan
      summary: Retry a failed or completed SBOM scan
      description: >-
        Re-queues the scan under the same ID. For file-based scans that
        originated from a MinIO upload, a fresh presigned download URL is
        automatically regenerated from the stored source object key so expired
        links are never reused.
      parameters:
        - name: id
          required: true
          in: path
          description: Scan job UUID to retry
          schema:
            type: string
      responses:
        '201':
          description: Scan re-queued successfully, returns scanId and status
        '404':
          description: Scan not found
        '409':
          description: Scan is already queued or running
      tags: *ref_54
      security: *ref_55
  /api/v2/diagnostics/bandwidth/probe:
    get:
      operationId: v2_DiagnosticsController_downloadProbe
      summary: Bandwidth Download Probe
      description: Returns a 64KB payload for agents to measure download bandwidth.
      parameters: []
      responses:
        '200':
          description: 64KB octet-stream payload
      tags: &ref_56
        - Diagnostics
      security: &ref_57
        - bearer: []
    post:
      operationId: v2_DiagnosticsController_uploadProbe
      summary: Bandwidth Upload Probe
      description: >-
        Accepts any body (discarded) and returns 200 OK. Agents time the upload
        of a 64KB payload to estimate upload bandwidth.
      parameters: []
      responses:
        '200':
          description: Empty 200 OK
      tags: *ref_56
      security: *ref_57
  /api/v2/metrics/throughput:
    get:
      operationId: v2_MetricsController_getThroughput
      summary: Download Throughput
      description: >-
        Returns a time-series of download bandwidth metrics (MB/min) for the
        given time range.
      parameters:
        - name: range
          required: false
          in: query
          description: Time range (e.g. '1h', '24h', '7d'). Defaults to '24h'.
          schema:
            type: string
      responses:
        '200':
          description: Array of { timestamp, mbPerMin } data points
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ThroughputDataPointDto'
      tags: &ref_58
        - Metrics
      security: &ref_59
        - bearer: []
  /api/v2/metrics/deploy-success:
    get:
      operationId: v2_MetricsController_getDeploySuccessRate
      summary: Deploy Success Rate
      description: >-
        Returns the aggregate deployment success rate and a sparkline for the
        given number of days.
      parameters:
        - name: days
          required: false
          in: query
          description: Number of days to look back. Defaults to 7.
          schema:
            type: string
      responses:
        '200':
          description: Deployment success rate with sparkline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeploySuccessRateDto'
      tags: *ref_58
      security: *ref_59
  /api/v2/metrics/installations:
    get:
      operationId: v2_MetricsController_getInstallationsCount
      summary: Installations Count
      description: >-
        Returns the number of successful installations within the given time
        window.
      parameters:
        - name: since
          required: false
          in: query
          description: Time window (e.g. '1h', '24h', '7d'). Defaults to '24h'.
          schema:
            type: string
      responses:
        '200':
          description: Installations count within time window
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallationsCountDto'
      tags: *ref_58
      security: *ref_59
  /api/v2/alerts:
    get:
      operationId: v2_AlertsController_getRecentAlerts
      summary: Get Recent Alerts
      description: Returns the most recent alerts/events from the database.
      parameters:
        - name: limit
          required: false
          in: query
          description: Maximum number of alerts to return. Defaults to 10.
          schema:
            type: string
        - name: since
          required: false
          in: query
          description: Time window (e.g. '1h', '24h', '7d'). Defaults to all.
          schema:
            type: string
      responses:
        '200':
          description: Array of alert events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertEventDto'
      tags: &ref_60
        - Alerts
      security: &ref_61
        - bearer: []
  /api/v2/alerts/device/{deviceId}:
    get:
      operationId: v2_AlertsController_getDeviceAlerts
      summary: Get Alerts for Device
      description: Returns the most recent alerts for a specific device.
      parameters:
        - name: deviceId
          required: true
          in: path
          description: Device ID to filter alerts
          schema:
            type: string
        - name: limit
          required: false
          in: query
          description: Maximum number of alerts to return. Defaults to 20.
          schema:
            type: string
      responses:
        '200':
          description: Array of alert events for the device
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertEventDto'
      tags: *ref_60
      security: *ref_61
  /api/v2/alerts/project:
    get:
      operationId: v2_AlertsController_getProjectAlerts
      summary: Get Alerts for Project
      description: >-
        Returns the most recent alerts for a specific project. Filter by
        projectId or projectName.
      parameters:
        - name: projectId
          required: false
          in: query
          description: Project ID to filter alerts
          schema:
            type: number
        - name: projectName
          required: false
          in: query
          description: Project name to filter alerts
          schema:
            type: string
        - name: limit
          required: false
          in: query
          description: Maximum number of alerts to return. Defaults to 20.
          schema:
            type: string
      responses:
        '200':
          description: Array of alert events for the project
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AlertEventDto'
      tags: *ref_60
      security: *ref_61
  /api/v2/alerts/stream:
    get:
      operationId: v2_AlertsController_streamAlerts
      summary: Live Alerts Stream
      description: >-
        Server-Sent Events stream of live alerts. Optionally filter by deviceId
        query param.
      parameters:
        - name: deviceId
          required: false
          in: query
          description: Filter stream to alerts for a specific device.
          schema:
            type: string
        - name: projectId
          required: false
          in: query
          description: Filter stream to alerts for a specific project by ID.
          schema:
            type: number
      responses:
        '200':
          description: SSE stream emitting alert messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertStreamMessageDto'
      tags: *ref_60
      security: *ref_61
  /api/v1/device/status/stream:
    get:
      operationId: DeviceStatusSseController_streamDeviceStatus
      summary: Device Status SSE Stream
      description: >-
        Server-Sent Events endpoint that pushes real-time device status updates
        (discovery, delivery, deploy). Optionally filter by projectId and/or
        deviceIds query parameters.


        Each SSE message has the format: `{ data, id, type }` where `data` is a
        JSON-serialized `DeviceStatusEventDto`.


        **Note:** Not all properties are present on every event — availability
        depends on the `statusType`:

        - **DISCOVERY**: `deviceId`, `status`, `timestamp`, and optionally
        `message`, `error`, `metadata`.

        - **DELIVERY**: `deviceId`, `releaseId`, `projectId`, `status`,
        `timestamp`, and optionally `progress`, `message`, `error`.

        - **DEPLOY**: `deviceId`, `releaseId`, `projectId`, `status`,
        `timestamp`, and optionally `progress`, `message`, `error`.
      parameters:
        - name: projectId
          required: false
          in: query
          description: Filter events by project ID
          schema:
            type: string
        - name: deviceIds
          required: false
          in: query
          description: >-
            Filter events by specific device IDs (comma-separated or repeated
            query params)
          schema:
            type: array
            items: {}
      responses:
        '200':
          description: SSE stream emitting device status update messages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceStatusStreamMessageDto'
      tags:
        - Device Status SSE
      security:
        - bearer: []
info:
  title: Get-App
  description: The Get-App API swagger
  version: 0.5.4
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    UserLoginDto:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
    TokensDto:
      type: object
      properties:
        accessToken:
          type: string
        expireAt:
          format: date-time
          type: string
        refreshToken:
          type: string
        refreshExpireAt:
          format: date-time
          type: string
      required:
        - accessToken
        - refreshToken
    RefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
    ReleaseIdentifierDto:
      type: object
      properties:
        projectId:
          type: string
          description: Project ID
        projectName:
          type: string
          description: Project name
        version:
          type: string
          description: Release version
      required:
        - projectName
        - version
    PolicyAssociationDto:
      type: object
      properties:
        releases:
          description: Releases for this policy
          type: array
          items:
            $ref: '#/components/schemas/ReleaseIdentifierDto'
      required:
        - releases
    CreatePolicyDto:
      type: object
      properties:
        name:
          type: string
          description: Policy name
        description:
          type: string
          description: Policy description
        association:
          description: Policy associations
          allOf:
            - $ref: '#/components/schemas/PolicyAssociationDto'
        isActive:
          type: boolean
          description: Whether the policy is active
          default: true
        isPush:
          type: boolean
          description: Whether this policy should be pushed to agents
          default: false
        rule:
          type: object
          description: Rule engine compliant rule object
      required:
        - name
        - association
        - rule
    RuleAssociationDto:
      type: object
      properties:
        releases:
          description: Releases for policies
          type: array
          items:
            $ref: '#/components/schemas/ReleaseIdentifierDto'
        deviceTypeNames:
          description: Device type names for restrictions
          type: array
          items:
            type: string
        osTypes:
          description: OS types for restrictions
          type: array
          items:
            type: string
        deviceIds:
          description: Specific device IDs for restrictions
          type: array
          items:
            type: string
    UpdateRuleDto:
      type: object
      properties:
        name:
          type: string
          description: Rule name
        description:
          type: string
          description: Rule description
        type:
          type: string
          enum:
            - policy
            - restriction
          description: Rule type (policy or restriction)
        association:
          description: Rule associations
          allOf:
            - $ref: '#/components/schemas/RuleAssociationDto'
        isActive:
          type: boolean
          description: Whether the rule is active
          default: true
        isPush:
          type: boolean
          description: Whether this policy should be pushed to agents
          default: false
        rule:
          type: object
          description: Rule engine compliant rule object
    CreateRuleFieldDto:
      type: object
      properties:
        name:
          type: string
          description: Field name in JSONPath format (e.g., $.battery.level)
        type:
          type: string
          description: Field data type
        label:
          type: string
          description: Human-readable label
        description:
          type: string
          description: Field description
      required:
        - name
        - type
        - label
    PostInstallAction:
      type: object
      properties:
        type:
          type: string
          enum:
            - NONE
            - WEB
